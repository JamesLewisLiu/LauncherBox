name: Build LauncherBox

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v5
      - name: Compile LauncherBox for Windows x64
        shell: cmd
        run: call Build.cmd
      - name: Check fullscreen, input initialization, and portable settings
        shell: powershell
        run: .\tests\WindowsSmoke.ps1
      - uses: actions/upload-artifact@v6
        with:
          name: LauncherBox-Portable-Windows-x64
          path: |
            dist/LauncherBox.exe
            dist/VT323-LICENSE.txt
          if-no-files-found: error
