name: Build LauncherBox

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v5
      - name: Compile LauncherBox for Windows x64
        shell: cmd
        run: call Build.cmd
      - uses: actions/upload-artifact@v6
        with:
          name: LauncherBox-Windows-x64
          path: dist/LauncherBox.exe
          if-no-files-found: error
